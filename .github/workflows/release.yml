name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  desktop:
    name: Desktop (exe + MSIX)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Build desktop artifacts (exe + MSIX) into dist/
        shell: pwsh
        run: ./scripts/build-release.ps1 -SkipMobile

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v7
        with:
          name: clipbridge-desktop
          path: dist/desktop/**

  android:
    name: Android (debug APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Build debug APK
        working-directory: mobile
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: clipbridge-android-debug
          path: mobile/app/build/outputs/apk/debug/app-debug.apk

  release:
    name: GitHub Release
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Nomes carregam a versão (Beam-<ver>-win-x64.exe), então casamos por glob.
          files: |
            artifacts/clipbridge-desktop/*.exe
            artifacts/clipbridge-desktop/*.msix
            artifacts/clipbridge-android-debug/app-debug.apk
          generate_release_notes: true
